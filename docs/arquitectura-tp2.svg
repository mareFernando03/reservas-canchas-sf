<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .grupo { fill: #f6f8fa; stroke: #666; stroke-width: 1.5; }
      .caja { fill: #fff; stroke: #333; stroke-width: 1.2; }
      .firebase { fill: #fff7e6; stroke: #c77700; stroke-width: 1.2; }
      .propuesto { fill: #fff; stroke: #c77700; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .titulo { font-size: 15px; font-weight: 600; fill: #222; }
      .nombre { font-size: 13px; font-weight: 600; fill: #111; }
      .detalle { font-size: 11px; fill: #555; }
      .linea { stroke: #444; stroke-width: 1.3; fill: none; marker-end: url(#flecha); }
    </style>
  </defs>

  <!-- Dispositivo -->
  <rect class="grupo" x="20" y="20" width="560" height="420" rx="10"/>
  <text class="titulo" x="36" y="46">Teléfono Android: app Reservas Canchas SF</text>

  <rect class="caja" x="40" y="66" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="87">LoginActivity</text>
  <text class="detalle" x="52" y="104">registro e ingreso (nueva en TP2)</text>

  <rect class="caja" x="40" y="146" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="167">MainActivity</text>
  <text class="detalle" x="52" y="184">lista de canchas, cerrar sesión</text>

  <rect class="caja" x="40" y="226" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="247">DetalleCanchaActivity</text>
  <text class="detalle" x="52" y="264">llamar, cómo llegar, reservar</text>

  <rect class="caja" x="40" y="306" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="327">ReservaActivity</text>
  <text class="detalle" x="52" y="344">día, hora, duración, compartir</text>

  <path class="linea" d="M150,114 V144"/>
  <path class="linea" d="M150,194 V224"/>
  <path class="linea" d="M150,274 V304"/>

  <text class="detalle" x="40" y="382">Todas heredan de CicloDeVidaActivity</text>
  <text class="detalle" x="40" y="397">(log del ciclo de vida, barra superior, edge-to-edge)</text>

  <rect class="caja" x="320" y="66" width="240" height="48" rx="6"/>
  <text class="nombre" x="332" y="87">Canchas</text>
  <text class="detalle" x="332" y="104">datos de ejemplo en memoria</text>

  <rect class="caja" x="320" y="176" width="240" height="48" rx="6"/>
  <text class="nombre" x="332" y="197">Medicion</text>
  <text class="detalle" x="332" y="214">eventos de uso (nueva en TP2)</text>

  <rect class="firebase" x="320" y="286" width="240" height="56" rx="6"/>
  <text class="nombre" x="332" y="308">Firebase SDK</text>
  <text class="detalle" x="332" y="326">firebase-auth · firebase-analytics</text>

  <path class="linea" d="M260,170 C290,170 290,90 318,90"/>
  <path class="linea" d="M260,250 C290,250 290,200 318,200"/>
  <path class="linea" d="M260,90 C300,90 290,300 318,305"/>
  <path class="linea" d="M440,224 V284"/>

  <!-- Firebase -->
  <rect class="grupo" x="620" y="20" width="260" height="420" rx="10"/>
  <text class="titulo" x="636" y="46">Firebase (nube de Google)</text>

  <rect class="firebase" x="640" y="66" width="220" height="56" rx="6"/>
  <text class="nombre" x="652" y="88">Authentication</text>
  <text class="detalle" x="652" y="106">usuarios con email y contraseña</text>

  <rect class="firebase" x="640" y="156" width="220" height="56" rx="6"/>
  <text class="nombre" x="652" y="178">Analytics</text>
  <text class="detalle" x="652" y="196">eventos de uso para medir</text>

  <rect class="propuesto" x="640" y="246" width="220" height="70" rx="6"/>
  <text class="nombre" x="652" y="268">Cloud Firestore</text>
  <text class="detalle" x="652" y="286">propuesto: guardar reservas y</text>
  <text class="detalle" x="652" y="301">mostrar disponibilidad (RF08)</text>

  <path class="linea" d="M560,300 C600,300 600,94 638,94"/>
  <path class="linea" d="M560,315 C610,315 605,184 638,184"/>
  <path class="linea" d="M560,330 C610,330 605,281 638,281" stroke-dasharray="6 4"/>

  <!-- Apps externas -->
  <rect class="grupo" x="20" y="460" width="560" height="96" rx="10"/>
  <text class="titulo" x="36" y="484">Otras apps del teléfono (Intents implícitos)</text>
  <rect class="caja" x="40" y="498" width="160" height="40" rx="6"/>
  <text class="nombre" x="52" y="523">Marcador (DIAL)</text>
  <rect class="caja" x="220" y="498" width="160" height="40" rx="6"/>
  <text class="nombre" x="232" y="523">Mapas (VIEW geo:)</text>
  <rect class="caja" x="400" y="498" width="160" height="40" rx="6"/>
  <text class="nombre" x="412" y="523">Compartir (SEND)</text>

  <!-- Referencia -->
  <rect class="propuesto" x="640" y="480" width="40" height="22" rx="4"/>
  <text class="detalle" x="690" y="495">componente propuesto</text>
  <rect class="firebase" x="640" y="514" width="40" height="22" rx="4"/>
  <text class="detalle" x="690" y="529">Firebase</text>
</svg>
