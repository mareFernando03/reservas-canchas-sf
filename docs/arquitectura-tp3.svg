<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .grupo { fill: #f6f8fa; stroke: #666; stroke-width: 1.5; }
      .nube { fill: #eef5ff; stroke: #1f5fbf; stroke-width: 1.5; }
      .caja { fill: #fff; stroke: #333; stroke-width: 1.2; }
      .firebase { fill: #fff7e6; stroke: #c77700; stroke-width: 1.2; }
      .nuevo { fill: #e9f6ec; stroke: #2e7d32; stroke-width: 1.6; }
      .auto { fill: #e9f6ec; stroke: #2e7d32; stroke-width: 1.3; stroke-dasharray: 5 3; }
      .titulo { font-size: 15px; font-weight: 600; fill: #222; }
      .nombre { font-size: 13px; font-weight: 600; fill: #111; }
      .detalle { font-size: 11px; fill: #555; }
      .linea { stroke: #444; stroke-width: 1.3; fill: none; marker-end: url(#flecha); }
      .linea-v { stroke: #2e7d32; stroke-width: 1.6; fill: none; marker-end: url(#flecha); }
    </style>
  </defs>

  <!-- Teléfono -->
  <rect class="grupo" x="20" y="20" width="200" height="300" rx="10"/>
  <text class="titulo" x="34" y="46">App Android</text>
  <rect class="caja" x="34" y="62" width="172" height="78" rx="6"/>
  <text class="nombre" x="46" y="83">Reservas Canchas SF</text>
  <text class="detalle" x="46" y="101">cliente liviano: sólo muestra</text>
  <text class="detalle" x="46" y="115">y pide lo que la pantalla</text>
  <text class="detalle" x="46" y="129">necesita</text>
  <rect class="caja" x="34" y="152" width="172" height="62" rx="6"/>
  <text class="nombre" x="46" y="173">Datos chicos</text>
  <text class="detalle" x="46" y="191">lista paginada; disponibilidad</text>
  <text class="detalle" x="46" y="205">= hora + libre/ocupado</text>
  <rect class="firebase" x="34" y="226" width="172" height="80" rx="6"/>
  <text class="nombre" x="46" y="247">Firebase SDK</text>
  <text class="detalle" x="46" y="265">Auth y Analytics (MBaaS): se</text>
  <text class="detalle" x="46" y="279">escalan cambiando de plan;</text>
  <text class="detalle" x="46" y="293">Analytics dice cuándo hay picos</text>

  <!-- Nube -->
  <rect class="nube" x="260" y="20" width="620" height="400" rx="10"/>
  <text class="titulo" x="276" y="46">Google Cloud (propuesto) · en local: docker compose</text>

  <rect class="nuevo" x="280" y="70" width="170" height="92" rx="6"/>
  <text class="nombre" x="292" y="92">Balanceador</text>
  <text class="detalle" x="292" y="110">Cloud Run (incluido)</text>
  <text class="detalle" x="292" y="124">en local: nginx</text>
  <text class="detalle" x="292" y="138">round-robin + reintento</text>
  <text class="detalle" x="292" y="152">en otra réplica si una cae</text>

  <rect class="grupo" x="490" y="62" width="200" height="250" rx="8"/>
  <text class="nombre" x="502" y="82">API de reservas (stateless)</text>
  <rect class="nuevo" x="506" y="94" width="168" height="38" rx="6"/>
  <text class="detalle" x="518" y="117">instancia 1</text>
  <rect class="nuevo" x="506" y="140" width="168" height="38" rx="6"/>
  <text class="detalle" x="518" y="163">instancia 2</text>
  <rect class="nuevo" x="506" y="186" width="168" height="38" rx="6"/>
  <text class="detalle" x="518" y="209">instancia 3</text>
  <rect class="auto" x="506" y="232" width="168" height="38" rx="6"/>
  <text class="detalle" x="518" y="255">… hasta 20 (autoescalado)</text>
  <text class="detalle" x="502" y="290">mín. 0 (2 en el pico) · máx. 20</text>
  <text class="detalle" x="502" y="304">hasta 40 pedidos a la vez c/u</text>

  <rect class="nuevo" x="720" y="110" width="145" height="96" rx="6"/>
  <text class="nombre" x="732" y="132">Estado compartido</text>
  <text class="detalle" x="732" y="150">Memorystore Standard</text>
  <text class="detalle" x="732" y="164">en local: Redis</text>
  <text class="detalle" x="732" y="182">SET NX: un turno no</text>
  <text class="detalle" x="732" y="196">se reserva dos veces</text>

  <rect class="caja" x="280" y="330" width="440" height="72" rx="6"/>
  <text class="nombre" x="292" y="351">Monitoreo y decisión de escalado</text>
  <text class="detalle" x="292" y="369">métricas de Cloud Run (pedidos, latencia, instancias) + Analytics de la app:</text>
  <text class="detalle" x="292" y="383">picos de 17 a 23 h y fines de semana; antes de una campaña, prueba de carga</text>
  <text class="detalle" x="292" y="397">(backend/prueba_carga.py) y, si hace falta, instancias mínimas &gt; 0 en el horario pico</text>

  <path class="linea" d="M206,100 C240,100 250,116 278,116" stroke-dasharray="5 4"/>
  <text class="detalle" x="211" y="86">a implementar</text>
  <text class="detalle" x="700" y="232">salida a la VPC</text>
  <text class="detalle" x="700" y="246">(IP privada)</text>
  <path class="linea-v" d="M450,104 C475,104 480,113 504,113"/>
  <path class="linea-v" d="M450,116 C475,116 480,159 504,159"/>
  <path class="linea-v" d="M450,128 C475,128 480,205 504,205"/>
  <path class="linea" d="M674,113 C700,113 700,140 718,140"/>
  <path class="linea" d="M674,159 C700,159 700,158 718,158"/>
  <path class="linea" d="M674,205 C700,205 700,176 718,176"/>
  <path class="linea" d="M590,312 V328" stroke-dasharray="4 3"/>

  <!-- Referencia -->
  <rect class="nuevo" x="276" y="450" width="40" height="22" rx="4"/>
  <text class="detalle" x="326" y="465">nuevo en el TP3 (probado en local con docker compose)</text>
  <rect class="auto" x="276" y="482" width="40" height="22" rx="4"/>
  <text class="detalle" x="326" y="497">instancias que crea el autoescalado (configurado en cloudrun/service.yaml, sin desplegar)</text>
  <rect class="firebase" x="276" y="514" width="40" height="22" rx="4"/>
  <text class="detalle" x="326" y="529">Firebase (TP2)</text>
</svg>
