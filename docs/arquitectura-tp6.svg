<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -6 900 534" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .grupo { fill: #f6f8fa; stroke: #666; stroke-width: 1.5; }
      .caja { fill: #fff; stroke: #333; stroke-width: 1.2; }
      .firebase { fill: #fff7e6; stroke: #c77700; stroke-width: 1.2; }
      .nuevo { fill: #f3ecfb; stroke: #6a3fb0; stroke-width: 1.7; }
      .propuesto { fill: #fff; stroke: #6a3fb0; stroke-width: 1.3; stroke-dasharray: 6 4; }
      .titulo { font-size: 15px; font-weight: 600; fill: #222; }
      .nombre { font-size: 13px; font-weight: 600; fill: #111; }
      .detalle { font-size: 11px; fill: #555; }
      .linea { stroke: #444; stroke-width: 1.3; fill: none; marker-end: url(#flecha); }
      .linea-n { stroke: #6a3fb0; stroke-width: 1.6; fill: none; marker-end: url(#flecha); }
    </style>
  </defs>

  <!-- Teléfono -->
  <rect class="grupo" x="20" y="20" width="560" height="420" rx="10"/>
  <text class="titulo" x="36" y="46">Teléfono Android: app Reservas Canchas SF</text>

  <rect class="caja" x="40" y="66" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="87">ReservaActivity</text>
  <text class="detalle" x="52" y="104">pide permiso; al confirmar programa</text>

  <rect class="nuevo" x="40" y="136" width="220" height="62" rx="6"/>
  <text class="nombre" x="52" y="157">CanchasApp</text>
  <text class="detalle" x="52" y="174">ProcessLifecycleOwner: la app pasa</text>
  <text class="detalle" x="52" y="188">a 2.º plano / vuelve</text>

  <rect class="caja" x="40" y="220" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="241">LoginActivity</text>
  <text class="detalle" x="52" y="258">registra "abrir_desde_notificacion"</text>

  <rect class="nuevo" x="320" y="66" width="240" height="78" rx="6"/>
  <text class="nombre" x="332" y="87">Notificaciones</text>
  <text class="detalle" x="332" y="104">canales "recordatorios" y "novedades"</text>
  <text class="detalle" x="332" y="118">recordatorio de turno (2 h antes)</text>
  <text class="detalle" x="332" y="132">recordatorio de inactividad (7 días)</text>

  <rect class="nuevo" x="320" y="160" width="240" height="62" rx="6"/>
  <text class="nombre" x="332" y="181">WorkManager</text>
  <text class="detalle" x="332" y="198">dispara RecordatorioWorker aunque</text>
  <text class="detalle" x="332" y="212">la app esté cerrada o se reinicie</text>

  <rect class="nuevo" x="320" y="238" width="240" height="62" rx="6"/>
  <text class="nombre" x="332" y="259">MensajesPush</text>
  <text class="detalle" x="332" y="276">FirebaseMessagingService: recibe</text>
  <text class="detalle" x="332" y="290">push con la app abierta; token FCM</text>

  <rect class="caja" x="320" y="316" width="240" height="48" rx="6"/>
  <text class="nombre" x="332" y="337">Barra de notificaciones</text>
  <text class="detalle" x="332" y="354">tocar → abre la app (LoginActivity)</text>

  <rect class="nuevo" x="40" y="290" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="311">Firebase SDK</text>
  <text class="detalle" x="52" y="328">messaging (TP6) · analytics (TP2)</text>

  <path class="linea-n" d="M260,90 C290,90 290,100 318,100"/>
  <path class="linea-n" d="M260,166 C290,166 290,120 318,120"/>
  <path class="linea-n" d="M440,144 V158"/>
  <path class="linea-n" d="M560,191 C600,191 600,340 562,340"/>
  <path class="linea" d="M440,300 V314"/>
  <path class="linea" d="M318,350 C280,350 290,258 262,250"/>
  <path class="linea" d="M150,268 V288"/>


  <!-- Nube -->
  <rect class="grupo" x="620" y="20" width="260" height="420" rx="10"/>
  <text class="titulo" x="636" y="46">Firebase (nube de Google)</text>

  <rect class="nuevo" x="640" y="66" width="220" height="96" rx="6"/>
  <text class="nombre" x="652" y="88">Cloud Messaging (FCM)</text>
  <text class="detalle" x="652" y="106">entrega los push al dispositivo</text>
  <text class="detalle" x="652" y="122">temas: "novedades" (todos) y</text>
  <text class="detalle" x="652" y="136">"deporte_futbol5", "deporte_padel"…</text>
  <text class="detalle" x="652" y="152">(segmentación por deporte)</text>

  <rect class="nuevo" x="640" y="180" width="220" height="62" rx="6"/>
  <text class="nombre" x="652" y="201">Consola: campañas</text>
  <text class="detalle" x="652" y="218">mensaje, tema destino, horario,</text>
  <text class="detalle" x="652" y="232">conversión medida en Analytics</text>

  <rect class="firebase" x="640" y="260" width="220" height="62" rx="6"/>
  <text class="nombre" x="652" y="281">Analytics</text>
  <text class="detalle" x="652" y="298">retención por cohortes y aperturas</text>
  <text class="detalle" x="652" y="312">desde notificación</text>

  <rect class="propuesto" x="640" y="340" width="220" height="76" rx="6"/>
  <text class="nombre" x="652" y="361">API de reservas (TP3)</text>
  <text class="detalle" x="652" y="378">propuesto: con el Admin SDK de FCM</text>
  <text class="detalle" x="652" y="392">avisa "se liberó un turno" al</text>
  <text class="detalle" x="652" y="406">token del usuario</text>

  <path class="linea-n" d="M750,180 V164"/>
  <path class="linea-n" d="M638,110 C600,110 600,268 562,268"/>
  <path class="linea-n" d="M638,150 C612,150 615,352 562,352"/>
  <path class="linea" d="M862,378 C895,378 895,100 862,100" stroke-dasharray="5 4"/>
  <path class="linea-n" d="M40,300 H30 V10 H780 V64"/>
  <text class="detalle" x="300" y="7">suscripción a temas (subscribeToTopic) y token</text>
  <path class="linea" d="M150,338 V425 H595 C620,425 612,292 638,292"/>

  <!-- Referencia -->
  <rect class="nuevo" x="40" y="470" width="40" height="22" rx="4"/>
  <text class="detalle" x="90" y="485">nuevo en el TP6</text>
  <rect class="firebase" x="230" y="470" width="40" height="22" rx="4"/>
  <text class="detalle" x="280" y="485">Firebase (TP2)</text>
  <rect class="propuesto" x="420" y="470" width="40" height="22" rx="4"/>
  <text class="detalle" x="470" y="485">propuesto</text>
  <text class="detalle" x="40" y="515">Un push de FCM llega por dos caminos: con la app abierta pasa por MensajesPush; con la app en segundo plano lo muestra el SDK directo en la barra.</text>
</svg>
