<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .grupo { fill: #f6f8fa; stroke: #666; stroke-width: 1.5; }
      .caja { fill: #fff; stroke: #333; stroke-width: 1.2; }
      .firebase { fill: #fff7e6; stroke: #c77700; stroke-width: 1.2; }
      .nuevo { fill: #e9f6ec; stroke: #2e7d32; stroke-width: 1.6; }
      .propuesto { fill: #fff; stroke: #c77700; stroke-width: 1.2; stroke-dasharray: 6 4; }
      .titulo { font-size: 15px; font-weight: 600; fill: #222; }
      .nombre { font-size: 13px; font-weight: 600; fill: #111; }
      .detalle { font-size: 11px; fill: #555; }
      .linea { stroke: #444; stroke-width: 1.3; fill: none; marker-end: url(#flecha); }
      .linea-nueva { stroke: #2e7d32; stroke-width: 1.6; fill: none; marker-end: url(#flecha); }
    </style>
  </defs>

  <!-- Dispositivo -->
  <rect class="grupo" x="20" y="20" width="560" height="500" rx="10"/>
  <text class="titulo" x="36" y="46">Teléfono Android: app Reservas Canchas SF</text>

  <rect class="caja" x="40" y="66" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="87">LoginActivity</text>
  <text class="detalle" x="52" y="104">registro e ingreso</text>

  <rect class="caja" x="40" y="146" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="167">MainActivity</text>
  <text class="detalle" x="52" y="184">lista ordenada por cercanía (TP7)</text>

  <rect class="caja" x="40" y="226" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="247">DetalleCanchaActivity</text>
  <text class="detalle" x="52" y="264">mapa embebido (TP7), llamar, reservar</text>

  <rect class="caja" x="40" y="306" width="220" height="48" rx="6"/>
  <text class="nombre" x="52" y="327">ReservaActivity</text>
  <text class="detalle" x="52" y="344">pronóstico del turno (TP7)</text>

  <path class="linea" d="M150,114 V144"/>
  <path class="linea" d="M150,194 V224"/>
  <path class="linea" d="M150,274 V304"/>

  <text class="detalle" x="40" y="382">Todas heredan de CicloDeVidaActivity</text>
  <text class="detalle" x="40" y="397">(log del ciclo de vida, barra superior, edge-to-edge)</text>

  <rect class="caja" x="320" y="66" width="240" height="44" rx="6"/>
  <text class="nombre" x="332" y="86">Canchas</text>
  <text class="detalle" x="332" y="102">datos de ejemplo en memoria</text>

  <rect class="caja" x="320" y="126" width="240" height="44" rx="6"/>
  <text class="nombre" x="332" y="146">Medicion</text>
  <text class="detalle" x="332" y="162">eventos de uso</text>

  <rect class="nuevo" x="320" y="186" width="240" height="56" rx="6"/>
  <text class="nombre" x="332" y="207">Clima</text>
  <text class="detalle" x="332" y="223">cliente REST de Open-Meteo, en un</text>
  <text class="detalle" x="332" y="237">hilo aparte (HttpURLConnection + JSON)</text>

  <rect class="firebase" x="320" y="262" width="240" height="48" rx="6"/>
  <text class="nombre" x="332" y="283">Firebase SDK</text>
  <text class="detalle" x="332" y="300">firebase-auth · firebase-analytics</text>

  <rect class="nuevo" x="320" y="330" width="240" height="48" rx="6"/>
  <text class="nombre" x="332" y="351">osmdroid (SDK de mapas)</text>
  <text class="detalle" x="332" y="368">MapView + Marker, sin API key</text>

  <rect class="nuevo" x="320" y="398" width="240" height="62" rx="6"/>
  <text class="nombre" x="332" y="419">Play Services Location</text>
  <text class="detalle" x="332" y="436">FusedLocationProviderClient:</text>
  <text class="detalle" x="332" y="451">ubicación aproximada (GPS / red)</text>

  <!-- dentro del teléfono -->
  <path class="linea" d="M260,160 C290,160 290,88 318,88"/>
  <path class="linea" d="M260,240 C290,240 290,148 318,148"/>
  <path class="linea" d="M260,90 C300,90 290,280 318,282"/>
  <path class="linea-nueva" d="M260,330 C290,330 290,214 318,214"/>
  <path class="linea-nueva" d="M260,258 C292,258 292,354 318,354"/>
  <path class="linea-nueva" d="M260,180 C286,180 286,428 318,428"/>

  <!-- Nube -->
  <rect class="grupo" x="620" y="20" width="260" height="500" rx="10"/>
  <text class="titulo" x="636" y="46">Servicios en internet</text>

  <rect class="firebase" x="640" y="66" width="220" height="50" rx="6"/>
  <text class="nombre" x="652" y="87">Firebase Authentication</text>
  <text class="detalle" x="652" y="104">usuarios con email y contraseña</text>

  <rect class="firebase" x="640" y="132" width="220" height="50" rx="6"/>
  <text class="nombre" x="652" y="153">Firebase Analytics</text>
  <text class="detalle" x="652" y="170">eventos de uso para medir</text>

  <rect class="nuevo" x="640" y="206" width="220" height="56" rx="6"/>
  <text class="nombre" x="652" y="228">Open-Meteo API</text>
  <text class="detalle" x="652" y="245">GET /v1/forecast: temperatura y</text>
  <text class="detalle" x="652" y="258">probabilidad de lluvia por hora</text>

  <rect class="nuevo" x="640" y="286" width="220" height="56" rx="6"/>
  <text class="nombre" x="652" y="308">OpenStreetMap</text>
  <text class="detalle" x="652" y="325">servidor de mosaicos (tiles)</text>
  <text class="detalle" x="652" y="338">del mapa, estilo Mapnik</text>

  <rect class="propuesto" x="640" y="370" width="220" height="62" rx="6"/>
  <text class="nombre" x="652" y="392">Cloud Firestore</text>
  <text class="detalle" x="652" y="410">propuesto: guardar reservas y</text>
  <text class="detalle" x="652" y="424">mostrar disponibilidad (RF08)</text>

  <path class="linea" d="M560,278 C600,278 600,92 638,92"/>
  <path class="linea" d="M560,292 C606,292 604,158 638,158"/>
  <path class="linea-nueva" d="M560,214 C600,214 600,234 638,234"/>
  <path class="linea-nueva" d="M560,354 C600,354 600,314 638,314"/>
  <path class="linea" d="M560,300 C612,300 606,400 638,400" stroke-dasharray="6 4"/>

  <!-- Apps externas -->
  <rect class="grupo" x="20" y="540" width="560" height="96" rx="10"/>
  <text class="titulo" x="36" y="564">Otras apps del teléfono (Intents implícitos)</text>
  <rect class="caja" x="36" y="576" width="120" height="44" rx="6"/>
  <text class="nombre" x="46" y="595">Marcador</text>
  <text class="detalle" x="46" y="611">ACTION_DIAL</text>
  <rect class="caja" x="166" y="576" width="120" height="44" rx="6"/>
  <text class="nombre" x="176" y="595">Mapas</text>
  <text class="detalle" x="176" y="611">"Cómo llegar", geo:</text>
  <rect class="caja" x="296" y="576" width="120" height="44" rx="6"/>
  <text class="nombre" x="306" y="595">Compartir</text>
  <text class="detalle" x="306" y="611">ACTION_SEND</text>

  <!-- Referencia -->
  <rect class="nuevo" x="640" y="556" width="40" height="22" rx="4"/>
  <text class="detalle" x="690" y="571">nuevo en el TP7</text>
  <rect class="firebase" x="640" y="588" width="40" height="22" rx="4"/>
  <text class="detalle" x="690" y="603">Firebase (TP2)</text>
  <rect class="propuesto" x="640" y="620" width="40" height="22" rx="4"/>
  <text class="detalle" x="690" y="635">componente propuesto</text>
</svg>
