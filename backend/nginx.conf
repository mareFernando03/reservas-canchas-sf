events {}

http {
    # El DNS interno de Docker resuelve "api" a todas las réplicas; se vuelve a consultar
    # cada 5 s para enterarse cuando se agregan o se sacan réplicas.
    resolver 127.0.0.11 valid=5s;

    # 'resolve' en upstream existe en nginx open source desde la 1.27.3.
    upstream api {
        zone api 64k;
        # Round-robin entre réplicas. Una réplica que falla queda afuera 10 s.
        server api:8000 resolve max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;
        location / {
            proxy_pass http://api;
            # Redundancia: si una réplica no responde, el pedido se reintenta en otra. nginx no
            # reintenta un POST que ya llegó a la réplica (no es idempotente): sólo los GET.
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
            # Sin esto, una réplica colgada demora 60 s (el valor por defecto) antes del reintento.
            proxy_read_timeout 5s;
        }
    }
}
